name: release

# Builds an sdist + wheel on every tag matching v*, publishes to PyPI via
# Trusted Publishing (no API tokens stored in repo secrets), and creates a
# GitHub Release with the artifacts attached.
#
# One-time setup is documented in PUBLISHING.md.

on:
  push:
    tags:
      # Match v0.x.x but NOT vscode-v* (which has its own workflow).
      - "v[0-9]*"
  workflow_dispatch:

# Avoid two release runs racing for the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: twine check
        run: python -m twine check dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    # Don't block github-release on a PyPI failure (e.g. Trusted Publisher
    # not yet configured, or version already uploaded manually via twine).
    continue-on-error: true
    # The GitHub Environment must match what is configured on PyPI under
    # "Trusted publishers". See PUBLISHING.md for setup.
    environment:
      name: pypi
      url: https://pypi.org/p/stata-code
    permissions:
      # Required for PyPI Trusted Publishing (OIDC).
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` — this uses OIDC against the trusted publisher
        # configured at https://pypi.org/manage/project/stata-code/settings/publishing/
        with:
          skip-existing: true

  github-release:
    name: create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create GitHub Release and upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber

name: release

# Builds an sdist + wheel on every tag matching v*, publishes to PyPI via
# Trusted Publishing (no API tokens stored in repo secrets), and creates a
# GitHub Release with the artifacts attached.
#
# One-time setup is documented in PUBLISHING.md.

on:
  push:
    tags:
      # Match v0.x.x but NOT vscode-v* (which has its own workflow).
      - "v[0-9]*"
  workflow_dispatch:

# Avoid two release runs racing for the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify tag matches project versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check_versions.py --tag "$GITHUB_REF_NAME"

      - name: Build sdist + wheel
        run: python -m build

      - name: twine check
        run: python -m twine check dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish-testpypi:
    name: publish to TestPyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    # Don't block PyPI / github-release on a TestPyPI failure. TestPyPI
    # needs its own trusted publisher configured at
    # https://test.pypi.org/manage/project/stata-code/settings/publishing/
    # (owner=brycewang-stanford, repo=stata-code, workflow=release.yml,
    # environment=testpypi). If that's not yet configured, this job
    # fails with `invalid-publisher` but the release still proceeds.
    continue-on-error: true
    environment:
      name: testpypi
      url: https://test.pypi.org/p/stata-code
    permissions:
      # Required for TestPyPI Trusted Publishing (OIDC).
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: publish to PyPI (Trusted Publishing)
    # `needs: publish-testpypi` chains TestPyPI → PyPI; because that job
    # has continue-on-error, a TestPyPI failure does not block PyPI.
    needs: publish-testpypi
    runs-on: ubuntu-latest
    # Don't block github-release on a PyPI failure (e.g. Trusted Publisher
    # not yet configured, or version already uploaded manually via twine).
    continue-on-error: true
    # The GitHub Environment must match what is configured on PyPI under
    # "Trusted publishers". See PUBLISHING.md for setup.
    environment:
      name: pypi
      url: https://pypi.org/p/stata-code
    permissions:
      # Required for PyPI Trusted Publishing (OIDC).
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` — this uses OIDC against the trusted publisher
        # configured at https://pypi.org/manage/project/stata-code/settings/publishing/
        with:
          skip-existing: true

  verify-pypi:
    name: verify PyPI publish
    # Authoritative signal that the PyPI publish actually landed. Because
    # `publish-pypi` is `continue-on-error: true` (so a TestPyPI/PyPI hiccup
    # doesn't block the GitHub Release), the only way an `invalid-publisher`
    # or similar failure surfaces in the workflow status is via this job.
    # Intentionally NOT `continue-on-error` — if PyPI doesn't have the
    # version after this completes, the workflow run is marked failed.
    needs: publish-pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Poll PyPI for the published version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # Per-version JSON returns 200 once the release is live, 404 until
          # then. PyPI's CDN can lag the upload by a minute or two; poll for
          # up to ~5 minutes before declaring failure.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://pypi.org/pypi/stata-code/${VERSION}/json")
            if [ "$code" = "200" ]; then
              echo "stata-code==${VERSION} is live on PyPI."
              exit 0
            fi
            echo "attempt ${i}/30: HTTP ${code}, retrying in 10s..."
            sleep 10
          done
          echo "::error::stata-code==${VERSION} not visible on PyPI after 5 minutes."
          echo "Check https://pypi.org/manage/project/stata-code/settings/publishing/"
          echo "and the publish-pypi job logs for an invalid-publisher or upload error."
          exit 1

  github-release:
    name: create GitHub Release
    # Depends on `publish-pypi` directly (not `verify-pypi`) so that the
    # GitHub Release is still created when PyPI verification fails — the
    # release artifacts and notes are useful even if PyPI is broken.
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create GitHub Release and upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber

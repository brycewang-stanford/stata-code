name: vscode-release

# Builds and publishes the VSCode extension to the Visual Studio Marketplace.
#
# Triggers:
#   - push tag matching vscode-v*  → package + publish + attach to GH release
#   - workflow_dispatch            → package only (sanity build, no publish)
#
# One-time setup:
#   1. Create a publisher at https://marketplace.visualstudio.com/manage
#      whose ID matches `publisher` in vscode/package.json (brycewang-stanford).
#   2. Create an Azure DevOps PAT with Organization=All accessible organizations
#      and Scope=Marketplace → Manage.
#   3. Add it as repo secret VSCE_PAT.
#
# Release flow:
#   - bump vscode/package.json version
#   - git tag vscode-v0.3.1 && git push --tags

on:
  push:
    tags:
      - "vscode-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Marketplace (otherwise package only)"
        type: boolean
        default: false

concurrency:
  group: vscode-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: package + publish vsix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#vscode-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "tag=$TAG_VERSION pkg=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $TAG_VERSION does not match package.json $PKG_VERSION"
            exit 1
          fi

      - name: Verify unified project versions
        working-directory: ${{ github.workspace }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/vscode-v* ]]; then
            python3 scripts/check_versions.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/check_versions.py
          fi

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Package extension
        run: npm run package:vsix -- --out stata-code.vsix

      - name: Upload vsix as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: stata-code-vsix
          path: vscode/stata-code.vsix
          if-no-files-found: error

      - name: Publish to VS Code Marketplace
        if: |
          startsWith(github.ref, 'refs/tags/vscode-v')
          || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npm run publish:vsix -- --pat "$VSCE_PAT" --packagePath stata-code.vsix

      - name: Attach vsix to GitHub Release
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" stata-code.vsix --clobber

      # Also publish to Open VSX so Cursor, VSCodium, Gitpod, Code Server,
      # and Windsurf can install the extension without going through the
      # Microsoft Marketplace.
      #
      # Setup (one-time):
      #   1. Sign in at https://open-vsx.org/ with the GitHub account that
      #      owns the `brycewang-stanford` namespace (create the namespace
      #      via the open-vsx CLI if it doesn't exist yet).
      #   2. Generate a Personal Access Token at
      #      https://open-vsx.org/user-settings/tokens
      #   3. Add it as repo secret OVSX_PAT.
      #
      # The step is gated on the secret being set, and uses
      # `continue-on-error: true` so a missing / expired Open VSX token
      # never blocks the primary VS Code Marketplace publish.
      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        continue-on-error: true
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT not set; skipping Open VSX publish."
            exit 0
          fi
          npm install -g ovsx
          ovsx publish stata-code.vsix --pat "$OVSX_PAT"

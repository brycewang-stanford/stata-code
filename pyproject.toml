[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stata-code"
version = "0.6.5"
description = "Agent-native Stata bridge — one core, multiple frontends (MCP, Jupyter, VSCode)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Bryce Wang", email = "brycewang@stanford.edu" }
]
keywords = ["stata", "jupyter", "vscode", "mcp", "pystata", "causal-inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pydantic>=2.0",
    # `pystata` ships with Stata 17+ at /Applications/Stata/utilities/pystata
    # (macOS) or equivalent — it is NOT on PyPI. Our `_runtime` module locates
    # and adds it to sys.path on init, so we deliberately do not declare it
    # as a runtime dependency. Users without Stata 17+ will get a clear
    # `PystataNotAvailable` error.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "mypy>=1.8",
]
mcp = ["mcp>=1.27"]
kernel = ["ipykernel>=6.0"]
all = ["stata-code[mcp,kernel]"]

[project.scripts]
stata-code-kernel = "stata_code.kernel.kernel:run_main"
stata-code-mcp = "stata_code.mcp.server:run_main"

[project.urls]
Homepage = "https://github.com/brycewang-stanford/stata-code"
Repository = "https://github.com/brycewang-stanford/stata-code"
Issues = "https://github.com/brycewang-stanford/stata-code/issues"
Changelog = "https://github.com/brycewang-stanford/stata-code/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["stata_code"]

[tool.hatch.build.targets.sdist]
include = [
  "/stata_code",
  "/tests",
  "/schema",
  "/scripts",
  "/examples",
  "/docs",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/LICENSE-POLICY.md",
  "/PUBLISHING.md",
  "/SCHEMA.md",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "stata_required: test exercises a real Stata installation via pystata. Skipped automatically when pystata is not available; CI can also exclude with `pytest -m 'not stata_required'`.",
]

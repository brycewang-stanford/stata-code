<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>stata-code — logo v4</title>
<style>
  :root { --ink:#0F172A; --muted:#64748B; --line:#E2E8F0; --bg:#F8FAFC; --cream:#FEFAF7; --orange:#CC785C; }
  * { box-sizing: border-box; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); margin:0; padding:48px 32px 96px; }
  header { max-width:1080px; margin:0 auto 32px; }
  h1 { font-size:24px; margin:0 0 6px; letter-spacing:-0.5px; }
  header p { color: var(--muted); margin:0; font-size:14px; }
  code { background:#EEF2F6; padding:1px 6px; border-radius:4px; font-size:12px; }
  .grid { max-width:1080px; margin:0 auto; display:grid; grid-template-columns: repeat(2, 1fr); gap:24px; }
  @media (max-width:720px) { .grid { grid-template-columns: 1fr; } }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .card .label { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .label strong { font-size:14px; }
  .label span { color: var(--muted); font-size:12px; }
  .row { padding:32px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:center; min-height:120px; }
  .row:last-child { border-bottom:0; }
  .row.cream { background: var(--cream); }
  .row.dark { background: #0F172A; }
  .mark { width:96px; height:96px; }
  .mark img { width:100%; height:100%; display:block; }
  .lockup img { max-width:100%; height:auto; display:block; }
  .stacked img { max-width:240px; height:auto; display:block; }
  .social img { width:100%; height:auto; display:block; border-radius:6px; }
  .favstrip { display:flex; align-items:flex-end; gap:24px; padding:24px; }
  .favstrip figure { margin:0; text-align:center; color:var(--muted); font-size:11px; }
  .favstrip img { display:block; image-rendering: -webkit-optimize-contrast; }
</style>
</head>
<body>
<header>
  <h1>stata-code — logo v4</h1>
  <p>Coef-plot mark · ink <code>#0F172A</code> · clay <code>#CC785C</code> · cream <code>#FEFAF7</code> · monospace wordmark.</p>
</header>

<div class="grid">

  <div class="card">
    <div class="label"><strong>Mark</strong><span>transparent · cream · dark · mono</span></div>
    <div class="row"><div class="mark"><img src="mark.svg" alt="mark"/></div></div>
    <div class="row cream"><div class="mark"><img src="mark-on-cream.svg" alt="mark on cream"/></div></div>
    <div class="row dark"><div class="mark"><img src="mark-on-dark.svg" alt="mark on dark"/></div></div>
    <div class="row"><div class="mark"><img src="mark-mono-ink.svg" alt="mark monochrome"/></div></div>
  </div>

  <div class="card">
    <div class="label"><strong>Lockups</strong><span>horizontal · on dark · stacked</span></div>
    <div class="row"><div class="lockup"><img src="horizontal.svg" alt="horizontal lockup" width="380"/></div></div>
    <div class="row"><div class="lockup"><img src="horizontal-on-dark.svg" alt="horizontal on dark" width="380"/></div></div>
    <div class="row"><div class="stacked"><img src="stacked.svg" alt="stacked"/></div></div>
  </div>

  <div class="card">
    <div class="label"><strong>Favicons</strong><span>16 · 32 · 180</span></div>
    <div class="row"><div class="favstrip">
      <figure><img src="favicon-16.png" alt="16px" width="16" height="16"/><figcaption>16</figcaption></figure>
      <figure><img src="favicon-32.png" alt="32px" width="32" height="32"/><figcaption>32</figcaption></figure>
      <figure><img src="apple-touch-icon-180.png" alt="180px" width="90" height="90"/><figcaption>180</figcaption></figure>
    </div></div>
  </div>

  <div class="card">
    <div class="label"><strong>Social card</strong><span>1200 × 630 (OG / Twitter)</span></div>
    <div class="row" style="padding:18px"><div class="social"><img src="social-card.svg" alt="social card"/></div></div>
  </div>

</div>
</body>
</html>

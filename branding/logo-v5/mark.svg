<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="stata-code mark">
  <title>stata-code mark</title>
  <defs>
    <linearGradient id="mtile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E2AA7"/>
      <stop offset="0.45" stop-color="#1A0F4A"/>
      <stop offset="0.7" stop-color="#140E44"/>
      <stop offset="1" stop-color="#1D5C8C"/>
    </linearGradient>
    <radialGradient id="mglowTL" cx="0.12" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#C33BD0" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#C33BD0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mglowBR" cx="0.95" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#36AFDA" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#36AFDA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mrim" x1="0" y1="0" x2="1" y2="1">

    <line x1="60" y1="22" x2="60" y2="106" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 6"/>
    <polyline points="76,38 42,64 80,90" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="40" y1="38" x2="96" y2="38" stroke="#FF4FD8" stroke-width="9" stroke-linecap="round" opacity="0.75" filter="url(#mblur)"/>

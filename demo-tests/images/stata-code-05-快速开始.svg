<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1450" width="1080" height="1450">
  <rect width="1080" height="1450" fill="#FFFFFF"/>

  <!-- title -->
  <text x="80" y="120" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="48" font-weight="700" fill="#0F172A">三行命令，全部跑起来</text>
  <text x="80" y="180" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="30" fill="#6B7280">前提：本机已装 Stata 18 + Python 3.10+</text>
  <rect x="80" y="220" width="120" height="6" fill="#2563EB"/>

  <!-- step 1 -->
  <text x="80" y="320" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="32" font-weight="700" fill="#2563EB">① 装包</text>
  <rect x="80" y="350" width="920" height="160" rx="20" fill="#0F172A"/>
  <text x="120" y="420" font-family="'Menlo','Monaco',monospace" font-size="32" fill="#34D399">$ pip install</text>
  <text x="120" y="470" font-family="'Menlo','Monaco',monospace" font-size="32" fill="#FFFFFF">    "stata-code[kernel]"</text>

  <!-- step 2 -->
  <text x="80" y="600" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="32" font-weight="700" fill="#2563EB">② 注册 Jupyter kernel</text>
  <rect x="80" y="630" width="920" height="160" rx="20" fill="#0F172A"/>
  <text x="120" y="700" font-family="'Menlo','Monaco',monospace" font-size="32" fill="#34D399">$ stata-code-kernel</text>
  <text x="120" y="750" font-family="'Menlo','Monaco',monospace" font-size="32" fill="#FFFFFF">    install --user</text>

  <!-- step 3 -->
  <text x="80" y="880" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="32" font-weight="700" fill="#2563EB">③ 启动 MCP 给 agent 用</text>
  <rect x="80" y="910" width="920" height="160" rx="20" fill="#0F172A"/>
  <text x="120" y="980" font-family="'Menlo','Monaco',monospace" font-size="32" fill="#34D399">$ stata-code-mcp</text>
  <text x="120" y="1030" font-family="'Menlo','Monaco',monospace" font-size="32" fill="#FFFFFF">    serve</text>

  <!-- bottom result -->
  <rect x="80" y="1140" width="920" height="220" rx="20" fill="#DBEAFE"/>
  <text x="540" y="1205" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="34" font-weight="700" fill="#1E40AF" text-anchor="middle">完成后你会得到</text>
  <text x="540" y="1255" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="26" fill="#1E3A8A" text-anchor="middle">Claude Code 里多出 stata_run 工具</text>
  <text x="540" y="1300" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="26" fill="#1E3A8A" text-anchor="middle">VS Code Notebook 里多出 Stata kernel 选项</text>

  <!-- footer -->
  <text x="540" y="1410" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="24" fill="#9CA3AF" text-anchor="middle">github.com/brycewang-stanford/stata-code</text>
</svg>
